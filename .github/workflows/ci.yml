name: AegisSMS CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Gate 1: Zero Data & Template-Family Leakage Verification
      run: pytest tests/gates/test_gate1_leakage.py -v

    - name: Gate 2: Quality Gates & Live Model Execution Metrics
      run: pytest tests/gates/test_gate2_metrics.py -v

    - name: Gate 3: 1,000 Golden Parity Vectors Verification
      run: pytest tests/gates/test_gate3_parity.py -v

    - name: Gate 4: Provenance Manifest & SHA-256 Hashes Verification
      run: pytest tests/gates/test_gate4_provenance_and_hashes.py -v

    - name: Gate 5: API & Concurrency Tests
      run: pytest tests/gates/test_gate5_api_concurrency.py -v

    - name: Adversarial & Obfuscation Robustness Suite
      run: pytest tests/test_adversarial.py -v
